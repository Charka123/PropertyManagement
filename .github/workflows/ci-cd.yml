name: PHP Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # We keep PHP setup because we still want to lint the files
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    # We removed the cache and composer install steps completely!

    - name: Run PHP Lint
      run: find . -name "*.php" ! -path "./vendor/*" -exec php -l {} \;

      # 3. Start PHP's web server targeting the PropertyManagement folder
    
    - name: Start Built-in Web Server
      run: php -S 127.0.0.1:8000 -t PropertyManagement &

    # 4. Test login.php directly at the root of that target
    - name: Test if login.php loads successfully
      run: |
        sleep 2
        
        # Now login.php is at the root level of the server because of the -t flag
        STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/login.php)
        
        echo "Login page returned HTTP status code: $STATUS_CODE"
        
        if [ "$STATUS_CODE" -ne 200 ] && [ "$STATUS_CODE" -ne 302 ]; then
          echo "Error: login.php failed to load properly!"
          exit 1
        fi
