name: PHP Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # We keep PHP setup because we still want to lint the files
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    # We removed the cache and composer install steps completely!

    - name: Run PHP Lint
      run: find . -name "*.php" ! -path "./vendor/*" -exec php -l {} \;
