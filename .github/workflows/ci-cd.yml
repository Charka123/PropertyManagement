name: PHP Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # We keep PHP setup because we still want to lint the files
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    # We removed the cache and composer install steps completely!

    - name: Run PHP Lint
      run: find . -name "*.php" ! -path "./vendor/*" -exec php -l {} \;

    # Start PHP's web server and force it to display errors
    - name: Start Built-in Web Server
      run: php -d display_errors=1 -S 127.0.0.1:8000 &

    # Test login.php right at the root level of the server
    - name: Test if login.php loads successfully
      run: |
        sleep 2
        
        # We catch the full HTML output in a temporary file this time
        STATUS_CODE=$(curl -s -o response.html -w "%{http_code}" http://127.0.0.1:8000/login.php)
        
        echo "Login page returned HTTP status code: $STATUS_CODE"
        
        if [ "$STATUS_CODE" -ne 200 ] && [ "$STATUS_CODE" -ne 302 ]; then
          echo "=============================================="
          echo "   CRASH DETECTED: PRINTING PHP ERROR LOG     "
          echo "=============================================="
          cat response.html # This will print the raw error text to your GitHub screen
          echo "=============================================="
          exit 1
        fi
  deploy:
    needs: validate-and-test # This forces the pipeline to only deploy if all tests pass!
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to GCP via Rsync
      uses: AEnterprise/rsync-deploy@v1.0.2
      env:
        DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        ARGS: "-avzr --delete --exclude='.git*' --exclude='.github*' --exclude='db-config.php'"
        SERVER_PORT: "22"
        FOLDER: "./" 
        SERVER_IP: ${{ secrets.SERVER_IP }}
        USERNAME: ${{ secrets.SERVER_USER }}
        SERVER_DESTINATION: "/var/www/html/" # The Apache folder we configured earlier