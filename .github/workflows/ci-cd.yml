name: PHP Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # We keep PHP setup because we still want to lint the files
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    # We removed the cache and composer install steps completely!

    - name: Run PHP Lint
      run: find . -name "*.php" ! -path "./vendor/*" -exec php -l {} \;

      # 3. Start PHP's built-in web server in the background
    - name: Start Built-in Web Server
      run: php -S 127.0.0.1:8000 &

    # 4. Wait a moment for the server to boot up, then test login.php
    - name: Test if login.php loads successfully
      run: |
        sleep 2
        
        # Make a request to the login page and get the HTTP response code
        STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/login.php)
        
        echo "Login page returned HTTP status code: $STATUS_CODE"
        
        # If it returns a 200 (Success) or 302 (Redirect), the test passes.
        # If it returns a 500 (Error) or 404 (Not Found), the test fails.
        if [ "$STATUS_CODE" -ne 200 ] && [ "$STATUS_CODE" -ne 302 ]; then
          echo "Error: login.php failed to load properly!"
          exit 1
        fi
